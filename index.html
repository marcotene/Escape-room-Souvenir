
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escape Room Souvenir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Roboto+Condensed:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            overscroll-behavior-y: contain;
            touch-action: pan-x pan-y;
            background-color: #09090b;
            color: #f4f4f5;
        }
        .canvas-container {
            aspect-ratio: 4 / 3;
            width: 100%;
            max-width: 800px;
            position: relative;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(185, 28, 28, 0.2);
            border: 2px solid #27272a;
        }
        .transform-element {
            position: absolute;
            user-select: none;
            touch-action: none;
            cursor: move;
        }
        .font-bangers { font-family: 'Bangers', cursive; }
        .font-marker { font-family: 'Permanent Marker', cursive; }
        .font-roboto { font-family: 'Roboto Condensed', sans-serif; }
        .font-mono { font-family: 'Share Tech Mono', monospace; }

        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #b91c1c; }

        .btn-mystic {
            background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%);
            border: 1px solid #b91c1c;
            box-shadow: 0 4px 15px rgba(185, 28, 28, 0.3);
            transition: all 0.3s ease;
        }
        .btn-mystic:hover {
            filter: brightness(1.2);
            box-shadow: 0 4px 20px rgba(185, 28, 28, 0.5);
            transform: translateY(-1px);
        }
        .card-dark {
            background: #18181b;
            border: 1px solid #27272a;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="min-h-screen">
    <div id="root"></div>
</body>
</html>
